# Place at the repo root (next to pnpm-workspace.yaml).
# Two env files live ONLY on the server (never in git):
#   .env     -> used by compose itself (POSTGRES_PASSWORD, API_DOMAIN)
#   api.env  -> given to the API container (app secrets, app_user / app_migrator URLs)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18          # matches your local Postgres 18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres   # superuser: used ONLY for bootstrap, never by the app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18+ images keep data in a versioned subfolder, so mount the PARENT folder
      - pgdata:/var/lib/postgresql
    # NO "ports:" on purpose. The database must never be public.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # NO "ports:" on purpose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: api.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
