# Place at the repo root (next to pnpm-workspace.yaml).
# ONE env file on the server: ~/app/my-chat-app/.env

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: livechat-api
  env_file: .env

services:
  db:
    image: pgvector/pgvector:pg18-trixie   # Postgres 18 + pgvector (needed by migration 0004)
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres   # superuser: used only for bootstrap, never by the app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18+ keeps data in a versioned subfolder, so mount the PARENT folder
      - pgdata:/var/lib/postgresql
    # NO "ports:" on purpose. The database must never be public.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # NO "ports:" on purpose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    <<: *api
    restart: unless-stopped
    environment:
      # The running API must never hold the real superuser password.
      # Its env check insists on a valid URL here, so give it a harmless dummy
      # (the API never uses it; only the "tools" service gets the real one).
      POSTGRES_PASSWORD: ""
      BOOTSTRAP_DATABASE_URL: postgresql://unused:unused@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    logging: *logging

  # One-off helper for bootstrap + migrations:
  #   docker compose run --rm -w /app/packages/db tools node_modules/.bin/tsx src/migrate.ts
  tools:
    <<: *api
    profiles: ["tools"]
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  # Dashboard (Next.js). Gets NO secrets: only the public API address.
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_ORIGIN}
    image: livechat-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    logging: *logging

  # Caddy = HTTPS front door + serves the built site and widget.js
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN}
        PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN}
        PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN}
    image: livechat-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config: